server.address=${JB_BIND_HOST:127.0.0.1}
server.port=${JB_API_PORT:8081}
spring.datasource.url=jdbc:postgresql://${JB_DB_HOST:127.0.0.1}:${JB_DB_PORT:55433}/${JB_DB_NAME:java_blueprints}
spring.datasource.username=${JB_DB_USER:java_blueprints}
spring.datasource.password=${JB_DB_PASSWORD}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${JB_SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
jb.origins=${JB_ALLOWED_ORIGINS:http://127.0.0.1:5174,http://localhost:5174,http://127.0.0.1:8081,http://localhost:8081}
jb.hosting.enabled=${JB_HOSTING_ENABLED:false}
jb.runner.enabled=${JB_RUNNER_ENABLED:false}
jb.runner.url=${JB_RUNNER_CONTROLLER_URL:http://127.0.0.1:8091}
jb.runner.token=${JB_RUNNER_CONTROLLER_TOKEN:}
jb.smtp.host=${JB_SMTP_HOST:}
jb.smtp.port=${JB_SMTP_PORT:465}
jb.smtp.username=${JB_SMTP_USERNAME:}
jb.smtp.password=${JB_SMTP_PASSWORD:}
jb.smtp.from=${JB_SMTP_FROM:}
jb.public-url=${JB_PUBLIC_URL:http://127.0.0.1:5174}
