name: java-blueprints
services:
  db:
    image: postgres@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    environment:
      POSTGRES_DB: ${JB_DB_NAME:-java_blueprints}
      POSTGRES_USER: ${JB_DB_USER:-java_blueprints}
      POSTGRES_PASSWORD: ${JB_DB_PASSWORD:?Set JB_DB_PASSWORD in .env}
    ports: ['127.0.0.1:55433:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [database]
  server:
    build:
      context: ..
      dockerfile: infra/server.Dockerfile
    image: java-blueprints-server:local
    ports: ['127.0.0.1:5174:8081']
    environment:
      JB_BIND_HOST: 0.0.0.0
      JB_DB_HOST: db
      JB_DB_PORT: 5432
      JB_DB_NAME: ${JB_DB_NAME:-java_blueprints}
      JB_DB_USER: ${JB_DB_USER:-java_blueprints}
      JB_DB_PASSWORD: ${JB_DB_PASSWORD:?Set JB_DB_PASSWORD}
      JB_RUNNER_ENABLED: 'true'
      JB_RUNNER_CONTROLLER_URL: http://runner:8091
      JB_RUNNER_CONTROLLER_TOKEN: ${JB_RUNNER_CONTROLLER_TOKEN:?Set JB_RUNNER_CONTROLLER_TOKEN}
      JB_ALLOWED_ORIGINS: ${JB_ALLOWED_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
      JB_SMTP_HOST: ${JB_SMTP_HOST:-}
      JB_SMTP_PORT: ${JB_SMTP_PORT:-465}
      JB_SMTP_USERNAME: ${JB_SMTP_USERNAME:-}
      JB_SMTP_PASSWORD: ${JB_SMTP_PASSWORD:-}
      JB_SMTP_FROM: ${JB_SMTP_FROM:-}
      JB_HOSTING_ENABLED: ${JB_HOSTING_ENABLED:-false}
      JB_SESSION_COOKIE_SECURE: ${JB_SESSION_COOKIE_SECURE:-false}
      JB_PUBLIC_URL: ${JB_PUBLIC_URL:-http://127.0.0.1:5174}
      JB_GITHUB_CLIENT_ID: ${JB_GITHUB_CLIENT_ID:-}
      JB_GITHUB_CLIENT_SECRET: ${JB_GITHUB_CLIENT_SECRET:-}
      JB_GITHUB_TOKEN_KEY: ${JB_GITHUB_TOKEN_KEY:-}
      JB_GITHUB_CALLBACK_URL: ${JB_GITHUB_CALLBACK_URL:-http://127.0.0.1:5174/api/v1/github/oauth/callback}
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
      runner:
        condition: service_started
    networks: [database,runner_control,web]
  runner:
    build:
      context: ..
      dockerfile: infra/runner/Dockerfile
    image: java-blueprints-runner:local
    environment:
      JB_RUNNER_TOKEN: ${JB_RUNNER_CONTROLLER_TOKEN:?Set JB_RUNNER_CONTROLLER_TOKEN}
      JB_RUNNER_PORT: 8091
      JB_RUNNER_BIND: 0.0.0.0
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [runner_control]
networks:
  database:
    driver: bridge
  runner_control:
    internal: true
  web:
    driver: bridge
volumes:
  postgres_data:
