name: java-blueprints-prod
services:
  db:
    image: postgres@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${JB_DB_NAME:?}
      POSTGRES_USER: ${JB_DB_USER:?}
      POSTGRES_PASSWORD: ${JB_DB_PASSWORD:?}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    networks: [database]
  server:
    image: java-blueprints-server:${JB_RELEASE_SHA:?}
    restart: unless-stopped
    ports: ['127.0.0.1:18684:8081']
    environment:
      JB_BIND_HOST: 0.0.0.0
      JB_DB_HOST: db
      JB_DB_PORT: 5432
      JB_DB_NAME: ${JB_DB_NAME:?}
      JB_DB_USER: ${JB_DB_USER:?}
      JB_DB_PASSWORD: ${JB_DB_PASSWORD:?}
      JB_HOSTING_ENABLED: 'true'
      JB_SESSION_COOKIE_SECURE: 'true'
      JB_PUBLIC_URL: ${JB_PUBLIC_URL:?}
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES: '127.0.0.1/32,::1/128,10.0.2.100/32,172.31.224.0/24'
      SERVER_TOMCAT_REMOTEIP_REMOTE_IP_HEADER: X-Forwarded-For
      SERVER_TOMCAT_REMOTEIP_PROTOCOL_HEADER: X-Forwarded-Proto
      JB_RUNNER_ENABLED: 'true'
      JB_RUNNER_CONTROLLER_URL: http://runner:8091
      JB_RUNNER_CONTROLLER_TOKEN: ${JB_RUNNER_CONTROLLER_TOKEN:?}
      JB_SMTP_HOST: ${JB_SMTP_HOST:-}
      JB_SMTP_PORT: ${JB_SMTP_PORT:-465}
      JB_SMTP_USERNAME: ${JB_SMTP_USERNAME:-}
      JB_SMTP_PASSWORD: ${JB_SMTP_PASSWORD:-}
      JB_SMTP_FROM: ${JB_SMTP_FROM:-}
      JB_GITHUB_CLIENT_ID: ${JB_GITHUB_CLIENT_ID:-}
      JB_GITHUB_CLIENT_SECRET: ${JB_GITHUB_CLIENT_SECRET:-}
      JB_GITHUB_TOKEN_KEY: ${JB_GITHUB_TOKEN_KEY:-}
      JB_GITHUB_CALLBACK_URL: ${JB_GITHUB_CALLBACK_URL:?}
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    depends_on:
      db:
        condition: service_healthy
      runner:
        condition: service_started
    networks: [database,runner_control,web]
  runner:
    image: java-blueprints-runner:${JB_RELEASE_SHA:?}
    restart: unless-stopped
    environment:
      JB_RUNNER_TOKEN: ${JB_RUNNER_CONTROLLER_TOKEN:?}
      JB_RUNNER_PORT: 8091
      JB_RUNNER_BIND: 0.0.0.0
      JB_RUNNER_NAMESPACE: production
    volumes: ['${JB_DOCKER_SOCKET:?}:/var/run/docker.sock']
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    networks: [runner_control]
networks:
  database:
    driver: bridge
    internal: true
  runner_control:
    driver: bridge
    internal: true
  web:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.224.0/24
volumes:
  postgres_data:
